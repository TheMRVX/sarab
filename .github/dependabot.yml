version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      cargo-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      npm-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
