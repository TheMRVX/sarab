name: Dependency License Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: Rust and frontend license inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build Web GUI and verify committed assets
        working-directory: gui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code --ignore-space-at-eol -- dist

      - name: Check licensing invariants and SPDX headers
        run: |
          python3 scripts/test_legal_policy.py
          python3 scripts/check_spdx.py
          python3 scripts/test_regression.py

      - name: Restore license tool build cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
          key: license-cli-v1-deny-0.20.2-about-0.9.2

      - name: Install license scanners
        run: |
          if ! command -v cargo-deny >/dev/null; then cargo install cargo-deny --version 0.20.2 --locked; fi
          if ! command -v cargo-about >/dev/null; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi

      - name: Audit Rust package licenses
        working-directory: app
        run: |
          cargo deny check licenses
          cargo about generate about.hbs > ../rust-license-report.md

      - name: Audit frontend production licenses
        working-directory: gui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;OFL-1.1" --json > ../frontend-license-report.json

      - name: Generate combined third-party notices
        run: |
          python3 scripts/generate_third_party_notices.py \
            --rust rust-license-report.md \
            --frontend-json frontend-license-report.json \
            --output license-artifacts/THIRD-PARTY-NOTICES.md

      - name: Verify committed notices match resolved lockfiles
        run: cmp THIRD-PARTY-NOTICES.md license-artifacts/THIRD-PARTY-NOTICES.md

      - name: Upload actual license audit outputs
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: license-audit
          path: |
            rust-license-report.md
            frontend-license-report.json
            license-artifacts/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 14

  browser-security:
    name: Real-Browser Security Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: app -> target

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: gui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Web GUI
        working-directory: gui
        run: |
          npm run build

      - name: Build Sarab Debug Binary
        working-directory: app
        run: |
          cargo build --locked

      - name: Install Playwright Chromium with dependencies
        working-directory: gui
        run: |
          npx playwright install --with-deps chromium

      - name: Run Real-Browser Security Suite
        env:
          SARAB_REQUIRE_BROWSER_TEST: "1"
        run: |
          node scripts/test_browser_security.mjs
