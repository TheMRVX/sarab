name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build and publish (e.g. v1.0.1)'
        required: false
        default: ''
      publish:
        description: 'Explicitly publish when manually dispatched (otherwise a dry-run)'
        type: boolean
        required: true
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'gui/package-lock.json'

      - name: Build Web GUI
        run: |
          cd gui
          npm ci
          npm run build

      - name: Audit dependency licenses and generate notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo install cargo-deny --version 0.20.2 --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo-deny installation failed" }
          cargo install cargo-about --version 0.9.2 --locked --features cli
          if ($LASTEXITCODE -ne 0) { throw "cargo-about installation failed" }
          Push-Location app
          cargo deny check licenses
          if ($LASTEXITCODE -ne 0) { throw "Rust license policy failed" }
          cargo about generate about.hbs > ..\rust-license-report.md
          if ($LASTEXITCODE -ne 0) { throw "Rust third-party notices generation failed" }
          Pop-Location
          Push-Location gui
          npx --yes license-checker@25.0.1 --production --json > ..\frontend-license-report.json
          if ($LASTEXITCODE -ne 0) { throw "Frontend license scan failed" }
          Pop-Location
          python scripts/generate_third_party_notices.py --rust rust-license-report.md --frontend-json frontend-license-report.json --output THIRD-PARTY-NOTICES.md
          if ($LASTEXITCODE -ne 0) { throw "Combined notices generation failed" }

      - name: Run Rust Unit Tests
        run: |
          cd app
          cargo test --locked --verbose

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "[*] Installing Inno Setup..."
          choco install -y innosetup
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup WDK Packages and Locate Paths
        shell: pwsh
        run: |
          Write-Host "[*] Installing Microsoft.Windows.WDK.x64 via NuGet..."
          nuget install Microsoft.Windows.WDK.x64 -OutputDirectory packages -ExcludeVersion
          
          Write-Host "[*] Locating WDF header and library directories..."
          $wdfHeader = Get-ChildItem -Path "packages", "C:\Program Files (x86)\Windows Kits\10" -Filter "wdf.h" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\umdf\*" } | Select-Object -First 1
          if ($wdfHeader) {
              $incDir = $wdfHeader.DirectoryName
              Write-Host "[+] Found UMDF include at: $incDir"
              "WDF_INC_DIR=$incDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
              throw "[-] UMDF wdf.h not found!"
          }

          $wdfLib = Get-ChildItem -Path "packages", "C:\Program Files (x86)\Windows Kits\10" -Filter "WdfDriverStubUm.lib" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\umdf\*" -and $_.FullName -like "*\x64\*" } | Select-Object -First 1
          if ($wdfLib) {
              $libDir = $wdfLib.DirectoryName
              Write-Host "[+] Found UMDF x64 library at: $libDir"
              "WDF_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
              throw "[-] UMDF WdfDriverStubUm.lib not found!"
          }

      - name: Build UMDF 2.0 Driver
        shell: cmd
        run: |
          msbuild driver\SarabGnss.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:WDF_INC_DIR="%WDF_INC_DIR%" /p:WDF_LIB_DIR="%WDF_LIB_DIR%" /v:normal

      - name: Create Test Certificate and Sign Driver Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "[*] Creating Self-Signed Code Signing Certificate..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Sarab Test Signing Certificate, O=TheMRVX" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256
          
          # Target driver release directory
          $driverDir = "driver\x64\Release"
          if (-not (Test-Path $driverDir)) {
              New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          }

          # Copy INF to the output directory
          Copy-Item "driver\SarabGnss.inf" -Destination "$driverDir\SarabGnss.inf"

          # Export public .cer
          $cerPath = "$driverDir\SarabGnss.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath
          Write-Host "[+] Certificate exported to $cerPath"

          # Find Inf2Cat.exe
          $inf2cat = (Get-ChildItem -Path "packages", "C:\Program Files (x86)\Windows Kits\10" -Filter "Inf2Cat.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "[*] Running Inf2Cat using $inf2cat..."
          & $inf2cat /driver:$driverDir /os:10_x64,Server10_x64

          # Find signtool.exe
          $signtool = (Get-ChildItem -Path "packages", "C:\Program Files (x86)\Windows Kits\10" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          # Find cat file generated by Inf2Cat (could be sarabgnss.cat or SarabGnss.cat)
          $catFile = (Get-ChildItem -Path $driverDir -Filter "*.cat" | Select-Object -First 1).FullName

          Write-Host "[*] Signing driver files with $signtool..."
          & $signtool sign /fd SHA256 /a /s My /n "Sarab Test Signing Certificate" $catFile
          & $signtool sign /fd SHA256 /a /s My /n "Sarab Test Signing Certificate" "$driverDir\SarabGnss.dll"

          Write-Host "[*] Importing test certificate into local Root store for verification..."
          Import-Certificate -CertStoreLocation "Cert:\LocalMachine\Root" -FilePath $cerPath
          Import-Certificate -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" -FilePath $cerPath

          Write-Host "[*] Verifying driver signature..."
          & $signtool verify /pa /v $catFile

      - name: Build Rust CLI (Release)
        shell: cmd
        run: |
          cd app
          cargo build --release --locked

      - name: Package Release Bundle & Compile Installer
        id: package
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $packageDir = "release_package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item "app\target\release\sarab.exe" -Destination "$packageDir\sarab.exe" -ErrorAction Stop
          Copy-Item "driver\x64\Release\SarabGnss.dll" -Destination "$packageDir\SarabGnss.dll" -ErrorAction Stop
          Copy-Item "driver\x64\Release\SarabGnss.inf" -Destination "$packageDir\SarabGnss.inf" -ErrorAction Stop
          Copy-Item "driver\x64\Release\*.cat" -Destination "$packageDir\SarabGnss.cat" -ErrorAction Stop
          Copy-Item "driver\x64\Release\SarabGnss.cer" -Destination "$packageDir\SarabGnss.cer" -ErrorAction Stop
          Copy-Item "README.md" -Destination "$packageDir\README.md" -ErrorAction Stop
          Copy-Item "LICENSE-APACHE" -Destination "$packageDir\LICENSE-APACHE" -ErrorAction Stop
          Copy-Item "LICENSE-MIT" -Destination "$packageDir\LICENSE-MIT" -ErrorAction Stop
          Copy-Item "NOTICE" -Destination "$packageDir\NOTICE" -ErrorAction Stop
          Copy-Item "THIRD-PARTY-NOTICES.md" -Destination "$packageDir\THIRD-PARTY-NOTICES.md" -ErrorAction Stop
          Copy-Item "docs\LICENSING.md" -Destination "$packageDir\LICENSING.md" -ErrorAction Stop
          # Inno Setup's license dialog must explicitly present either license (OR, not AND).
          $licenseChoice = "Sarab is licensed under MIT OR Apache-2.0, at your option." + [Environment]::NewLine +
            "The complete terms of both alternatives follow." + [Environment]::NewLine + [Environment]::NewLine +
            "====== MIT LICENSE ======" + [Environment]::NewLine +
            (Get-Content "LICENSE-MIT" -Raw -ErrorAction Stop) + [Environment]::NewLine +
            "====== APACHE LICENSE 2.0 ======" + [Environment]::NewLine +
            (Get-Content "LICENSE-APACHE" -Raw -ErrorAction Stop)
          Set-Content "$packageDir\LICENSE-CHOICE.txt" -Value $licenseChoice -Encoding utf8 -ErrorAction Stop
          foreach ($legalFile in @("LICENSE-MIT", "LICENSE-APACHE", "LICENSE-CHOICE.txt", "NOTICE", "THIRD-PARTY-NOTICES.md", "LICENSING.md")) {
            if (-not (Test-Path "$packageDir\$legalFile")) { throw "Missing legal distribution file: $legalFile" }
          }

          # Create helper install & uninstall batch scripts for convenience
          @"
          @echo off
          echo =======================================================
          echo   Installing Sarab Virtual GNSS Driver
          echo =======================================================
          echo.
          sarab.exe driver install
          echo.
          pause
          "@ | Out-File -FilePath "$packageDir\install.bat" -Encoding ascii

          @"
          @echo off
          echo Uninstalling Sarab Virtual GNSS Driver...
          sarab.exe driver uninstall
          pause
          "@ | Out-File -FilePath "$packageDir\uninstall.bat" -Encoding ascii

          # Determine version tag
          $tag = "v1.0.0"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME) {
              $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_RELEASE_TAG) {
              $tag = $env:INPUT_RELEASE_TAG
          }

          # Validate tag format (SemVer with leading 'v') before using it anywhere
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$') {
              throw "[-] Invalid release tag '$tag'. Expected SemVer like v0.1.1 or v1.0.0."
          }

          # Stage release assets folder
          New-Item -ItemType Directory -Path "release_assets" -Force | Out-Null

          $zipName = "sarab-$tag-x64.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipName -Force
          Write-Host "[+] Created $zipName successfully."
          Copy-Item $zipName -Destination "release_assets\$zipName" -ErrorAction Stop

          # Verify actual ZIP contents, not just the staging directory.
          $inspectionDir = Join-Path $env:RUNNER_TEMP "sarab-license-verification"
          Expand-Archive -Path $zipName -DestinationPath $inspectionDir -Force -ErrorAction Stop
          foreach ($legalFile in @("LICENSE-MIT", "LICENSE-APACHE", "LICENSE-CHOICE.txt", "NOTICE", "THIRD-PARTY-NOTICES.md", "LICENSING.md")) {
            $included = Join-Path $inspectionDir $legalFile
            if (-not (Test-Path $included)) { throw "Release ZIP missing: $legalFile" }
            if ((Get-Item $included).Length -eq 0) { throw "Empty release legal file: $legalFile" }
          }
          Get-ChildItem $inspectionDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          # Compute SHA256 checksum for zip
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Write-Host "[+] Generated SHA256: $hash  $zipName"

          # Compile Inno Setup Installer
          Write-Host "[*] Compiling Inno Setup installer..."
          $cleanVer = $tag.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$cleanVer" installer\sarab_installer.iss
          $installerExe = "installer\SarabSetup-v$cleanVer.exe"
          if (Test-Path $installerExe) {
              Write-Host "[+] Created installer: $installerExe"
              Copy-Item $installerExe -Destination "release_assets\SarabSetup-$tag.exe"
              $installerHash = (Get-FileHash -Path $installerExe -Algorithm SHA256).Hash.ToLower()
              "$installerHash  SarabSetup-$tag.exe" | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii -Append
              Write-Host "[+] Generated SHA256: $installerHash  SarabSetup-$tag.exe"
          } else {
              throw "[-] Inno Setup installer output not found at $installerExe"
          }

          Copy-Item "SHA256SUMS.txt" -Destination "release_assets\SHA256SUMS.txt"
          Copy-Item "$packageDir\SarabGnss.cer" -Destination "release_assets\SarabGnss.cer"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload dry-run artifacts without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: release_assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            prerelease=(--prerelease)
          fi
          echo "[*] Publishing GitHub Release for tag: $TAG ..."

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[*] Release $TAG exists, uploading/updating assets..."
            gh release upload "$TAG" release_assets/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release_assets/* \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Sarab $TAG" \
              --generate-notes \
              "${prerelease[@]}"
          fi
          echo "[+] GitHub Release published successfully: $TAG"
