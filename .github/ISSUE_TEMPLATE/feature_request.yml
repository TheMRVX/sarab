name: Feature request
description: Propose an improvement or new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What do you need to accomplish, and why is current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable results rather than mandating an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How could maintainers objectively verify completion?
